global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers: []   # hook up Alertmanager / Slack / PagerDuty here in prod

scrape_configs:
  - job_name: kafka-broker
    static_configs:
      - targets: ["broker:9404"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka-jmx
    static_configs:
      - targets: ["broker:9404"]